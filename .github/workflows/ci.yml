name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Capture pytest diagnostics
        run: uv run pytest -q > pytest-diagnostics.txt 2>&1 || true
      - name: Upload pytest diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: pytest-diagnostics.txt
      - run: uv run pytest -q
