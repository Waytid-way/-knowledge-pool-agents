name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16-bookworm
        env:
          POSTGRES_USER: llm_wiki
          POSTGRES_PASSWORD: llm_wiki
          POSTGRES_DB: llm_wiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llm_wiki -d llm_wiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LLM_WIKI_DATABASE_URL: postgresql+psycopg://llm_wiki:llm_wiki@localhost:5432/llm_wiki
      LLM_WIKI_TEST_DATABASE_URL: postgresql+psycopg://llm_wiki:llm_wiki@localhost:5432/llm_wiki
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Capture mypy diagnostics
        run: uv run mypy src > mypy-task3-residual.txt 2>&1 || true
      - name: Upload mypy diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: mypy-task3-residual
          path: mypy-task3-residual.txt
      - run: uv run mypy src
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
