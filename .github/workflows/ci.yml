name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - name: Capture Ruff diagnostics
        if: always()
        run: uv run ruff check . --output-format=json > ruff-diagnostics.json || true
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff-diagnostics.json
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
