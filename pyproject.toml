[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki"
version = "0.1.0"
description = "Scoped, auditable, multimodal PDF-to-knowledge platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "llm-wiki contributors" }]
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.39,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "opentelemetry-api>=1.35,<2",
  "opentelemetry-sdk>=1.35,<2",
  "opentelemetry-instrumentation-fastapi>=0.56b0,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "redis>=6.2,<7",
  "sqlalchemy>=2.0,<3",
  "temporalio>=1.15,<2",
  "typer>=0.16,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.136,<7",
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "testcontainers[postgres,minio]>=4.10,<5",
  "types-boto3>=1.39,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: requires local infrastructure",
  "e2e: exercises a complete ingestion flow",
]

[tool.ruff]
extend-exclude = ["alembic/versions"]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["llm_wiki"]

[tool.coverage.run]
source = ["llm_wiki"]
branch = true
